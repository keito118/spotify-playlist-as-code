name: Add song from issue

# Turns an "Add a song" issue into a pull request that adds the song to a
# playlist file. Needs "Allow GitHub Actions to create and approve pull
# requests" (Settings → Actions → General → Workflow permissions).

# Runs when an issue is opened with a "[Song]" title, or when the "add-song"
# label is added. The issue form adds the label, and a maintainer can add it
# to an issue that didn't use the form. The label must exist in the repository,
# or GitHub drops it from the form silently.
on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

concurrency:
  group: add-song
  cancel-in-progress: false

jobs:
  # This repository holds the tool itself, so point song suggestions to the live example.
  redirect:
    if: >-
      github.repository == 'keito118/spotify-playlist-as-code' &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'add-song' && github.event.issue.state == 'open') ||
        (github.event.action == 'opened' && !contains(github.event.issue.labels.*.name, 'add-song') && startsWith(github.event.issue.title, '[Song]'))
      )
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number }}
    steps:
      - run: |
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "Thanks! 🎶 This repository is the tool itself, so songs aren't added here. Please suggest it at [Open Source Mixtape](https://github.com/keito118/open-source-mixtape/issues/new?template=add-song.yml), the playlist that runs on this tool."
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY" --reason "not planned"

  add:
    if: >-
      github.repository != 'keito118/spotify-playlist-as-code' &&
      (
        (github.event.action == 'labeled' && github.event.label.name == 'add-song' && github.event.issue.state == 'open') ||
        (github.event.action == 'opened' && !contains(github.event.issue.labels.*.name, 'add-song') && startsWith(github.event.issue.title, '[Song]'))
      )
    runs-on: ubuntu-latest
    steps:
      - uses: keito118/spotify-playlist-as-code@v1
        with:
          command: add-song
          spotify-client-id: ${{ secrets.SPOTIFY_CLIENT_ID }}
          spotify-client-secret: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          spotify-refresh-token: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
