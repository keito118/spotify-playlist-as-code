name: Sync to Spotify

on:
  push:
    branches: [main]
    paths:
      - "playlists/**"
  workflow_dispatch:

permissions:
  contents: write  # to publish the track list image to the tracklist branch

concurrency:
  group: spotify-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository != 'keito118/spotify-playlist-as-code'
    runs-on: ubuntu-latest
    steps:
      - uses: keito118/spotify-playlist-as-code@v1
        with:
          command: sync
          spotify-client-id: ${{ secrets.SPOTIFY_CLIENT_ID }}
          spotify-client-secret: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          spotify-refresh-token: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
