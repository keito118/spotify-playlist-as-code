name: Validate playlists

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest -v
      - name: Check playlist files
        env:
          # Present for branches in this repo; empty for forks, which skips the online check.
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python -m pac validate --base "origin/${{ github.base_ref }}" --check-online
          else
            python -m pac validate --base "${{ github.event.before }}"
          fi

  # In this repository, main only receives releases from develop (or hotfix/*).
  # Copies made from the template skip this, so song PRs can go straight to main.
  source-branch:
    if: >-
      github.repository == 'keito118/spotify-playlist-as-code' &&
      github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check the branch being merged into main
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            develop|hotfix/*) echo "OK: $HEAD_REF -> main" ;;
            *) echo "::error::Pull requests into main must come from develop or hotfix/*, not '$HEAD_REF'. Target develop instead."; exit 1 ;;
          esac
