name: Validate playlists

on:
  pull_request:
  push:
    branches: [main]
  # Started by the "Add song from issue" workflow for the pull requests it opens.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    # The tool's own repository tests its code in ci.yml instead.
    if: github.repository != 'keito118/spotify-playlist-as-code'
    runs-on: ubuntu-latest
    steps:
      - uses: keito118/spotify-playlist-as-code@v1
        with:
          command: validate
          # Empty for pull requests from forks, which skips the online lookup.
          spotify-client-id: ${{ secrets.SPOTIFY_CLIENT_ID }}
          spotify-client-secret: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          spotify-refresh-token: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
