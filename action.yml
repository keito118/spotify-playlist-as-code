name: Playlist as Code for Spotify
description: Run a shared Spotify playlist from text files. Check song pull requests, sync on merge, and turn issues into song pull requests.
author: keito118
branding:
  icon: music
  color: green

inputs:
  command:
    description: "What to run: validate, sync, status or add-song."
    required: true
  spotify-client-id:
    description: Spotify app Client ID. Without the three Spotify inputs, validate skips the online lookup and sync is a dry run.
    required: false
    default: ""
  spotify-client-secret:
    description: Spotify app Client Secret.
    required: false
    default: ""
  spotify-refresh-token:
    description: Refresh token from scripts/get_refresh_token.py.
    required: false
    default: ""
  github-token:
    description: Token for git pushes, pull requests, issue comments and finding who added each song.
    required: false
    default: ${{ github.token }}
  tracklist-branch:
    description: "sync: branch that receives the track list images. Empty to skip."
    required: false
    default: tracklist
  validate-workflow:
    description: "add-song: the workflow file to start on the pull request it opens."
    required: false
    default: validate.yml

runs:
  using: composite
  steps:
    - name: Check the command
      shell: bash
      env:
        COMMAND: ${{ inputs.command }}
      run: |
        case "$COMMAND" in
          validate|sync|status|add-song) ;;
          *) echo "::error::Unknown command '$COMMAND'. Use validate, sync, status or add-song."; exit 1 ;;
        esac

    - uses: actions/checkout@v6
      with:
        fetch-depth: 0  # validate diffs against the base; credits read the history
        ref: ${{ inputs.command == 'add-song' && github.event.repository.default_branch || '' }}
        token: ${{ inputs.github-token }}

    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    # validate ---------------------------------------------------------------
    - name: Check playlist files
      if: inputs.command == 'validate'
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        SPOTIFY_CLIENT_ID: ${{ inputs.spotify-client-id }}
        SPOTIFY_CLIENT_SECRET: ${{ inputs.spotify-client-secret }}
        SPOTIFY_REFRESH_TOKEN: ${{ inputs.spotify-refresh-token }}
        EVENT: ${{ github.event_name }}
        BASE_REF: ${{ github.base_ref }}
        BEFORE: ${{ github.event.before }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        case "$EVENT" in
          pull_request|pull_request_target) python -P -m pac validate --base "origin/$BASE_REF" --check-online ;;
          workflow_dispatch) python -P -m pac validate --base "origin/$DEFAULT_BRANCH" --check-online ;;
          *) python -P -m pac validate ${BEFORE:+--base "$BEFORE"} ;;
        esac

    # sync -------------------------------------------------------------------
    - name: Sync playlists
      if: inputs.command == 'sync'
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        SPOTIFY_CLIENT_ID: ${{ inputs.spotify-client-id }}
        SPOTIFY_CLIENT_SECRET: ${{ inputs.spotify-client-secret }}
        SPOTIFY_REFRESH_TOKEN: ${{ inputs.spotify-refresh-token }}
      run: python -P -m pac sync

    - name: Show what is on Spotify now
      if: inputs.command == 'sync' || inputs.command == 'status'
      continue-on-error: ${{ inputs.command == 'sync' }}
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        SPOTIFY_CLIENT_ID: ${{ inputs.spotify-client-id }}
        SPOTIFY_CLIENT_SECRET: ${{ inputs.spotify-client-secret }}
        SPOTIFY_REFRESH_TOKEN: ${{ inputs.spotify-refresh-token }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        COMMAND: ${{ inputs.command }}
        BRANCH: ${{ inputs.tracklist-branch }}
        IMAGE_DIR: ${{ runner.temp }}/tracklist
      run: |
        if [ "$COMMAND" = sync ] && [ -n "$BRANCH" ]; then
          python -P -m pac status --image-dir "$IMAGE_DIR"
        else
          python -P -m pac status
        fi

    - name: Publish the track list image
      if: inputs.command == 'sync' && inputs.tracklist-branch != ''
      continue-on-error: true
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        BRANCH: ${{ inputs.tracklist-branch }}
        IMAGE_DIR: ${{ runner.temp }}/tracklist
      run: |
        [ -n "$(ls -A "$IMAGE_DIR" 2>/dev/null)" ] || { echo "No image to publish."; exit 0; }
        cd "$IMAGE_DIR"
        git init -q -b "$BRANCH"
        git add .
        git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
          commit -qm "Update the track list image"
        git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:$BRANCH"

    # add-song ---------------------------------------------------------------
    - name: Add the song to the playlist file
      id: add
      if: inputs.command == 'add-song'
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}
        SPOTIFY_CLIENT_ID: ${{ inputs.spotify-client-id }}
        SPOTIFY_CLIENT_SECRET: ${{ inputs.spotify-client-secret }}
        SPOTIFY_REFRESH_TOKEN: ${{ inputs.spotify-refresh-token }}
        ISSUE_BODY: ${{ github.event.issue.body }}
        ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
      run: python -P -m pac add --from-issue

    - name: Open the pull request
      if: inputs.command == 'add-song' && steps.add.outputs.ok == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NUMBER: ${{ github.event.issue.number }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        LABEL: ${{ steps.add.outputs.label }}
        AUTHOR: ${{ github.event.issue.user.login }}
        AUTHOR_ID: ${{ github.event.issue.user.id }}
        PR_BODY_FILE: ${{ runner.temp }}/pr-body.md
        VALIDATE: ${{ inputs.validate-workflow }}
      run: |
        branch="song/issue-$NUMBER"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git switch -c "$branch"
        git add playlists
        git commit -m "Add $LABEL" -m "Suggested in #$NUMBER." \
          -m "Co-authored-by: $AUTHOR <$AUTHOR_ID+$AUTHOR@users.noreply.github.com>"
        git push --force -u origin "$branch"
        url=$(gh pr create --base "$DEFAULT_BRANCH" --head "$branch" --title "Add $LABEL" --body-file "$PR_BODY_FILE")
        # Pull requests opened with GITHUB_TOKEN don't trigger other workflows, so start the check here.
        if [ -n "$VALIDATE" ]; then gh workflow run "$VALIDATE" --ref "$branch"; fi
        gh issue comment "$NUMBER" --body "Thanks! 🎶 I added **$LABEL** and opened $url. It goes into the playlist once it's merged."

    - name: Explain what went wrong
      if: inputs.command == 'add-song' && steps.add.outputs.ok == 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        NUMBER: ${{ github.event.issue.number }}
        ERROR: ${{ steps.add.outputs.error }}
      run: |
        printf '%s\n\n%s\n' "Sorry, I couldn't add this song: $ERROR" \
          "Please open a new issue with the corrected link." > "$RUNNER_TEMP/comment.md"
        gh issue comment "$NUMBER" --body-file "$RUNNER_TEMP/comment.md"
        gh issue close "$NUMBER" --reason "not planned"
